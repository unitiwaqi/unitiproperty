name: Deploy to production

# Builds the Docker image on GitHub's runner (not the shared VPS — that box is
# memory-tight and hosts several other live sites; see
# ~/Desktop/tech/VAULT/unitiproperty/Project/Deployment.md), then ships the built image
# to the server the same way it was deployed by hand: save -> scp -> load -> compose up.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

env:
  DEPLOY_HOST: 178.128.123.109
  DEPLOY_USER: root
  DEPLOY_DIR: /root/UnitiProperty
  IMAGE_NAME: unitiproperty-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (linux/amd64, matches the server)
        working-directory: web
        run: |
          docker buildx build --platform linux/amd64 -t "$IMAGE_NAME:latest" --load .

      - name: Save image
        run: docker save "$IMAGE_NAME:latest" | gzip > /tmp/image.tar.gz

      - name: Set up deploy key
        run: |
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Copy image to server
        run: |
          scp -i ~/.ssh/deploy_key /tmp/image.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/image.tar.gz"

      - name: Load and restart on server
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            cd "'"$DEPLOY_DIR"'"
            docker load < image.tar.gz
            rm image.tar.gz
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
          '

      - name: Smoke test
        run: |
          sleep 3
          code=$(ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3004/")
          echo "container responded: $code"
          [ "$code" = "200" ]
